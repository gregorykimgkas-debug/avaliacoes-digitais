<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prova digital de demonstração, com correção automática.">
  <title>Prova | AvalIA</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Página inicial">
      <span class="brand-mark">IA</span>
      <span>AvalIA</span>
    </a>
    <nav aria-label="Navegação principal">
      <a href="/#avaliacoes">← Voltar às avaliações</a>
    </nav>
  </header>

  <main>
    <section class="section" id="examSection">
      <div class="section-heading">
        <p class="eyebrow">Prova demonstrativa</p>
        <h2 id="examTitle">Carregando…</h2>
        <p id="examSubtitle"></p>
      </div>

      <form id="examForm" class="exam-form">
        <div class="exam-identification">
          <label>Seu nome (fictício, para a demonstração)
            <input type="text" id="participantName" required minlength="2" maxlength="100" placeholder="Ex.: Participante Demonstração">
          </label>
        </div>
        <div id="examQuestions"></div>
        <button type="submit" class="button primary" id="submitButton">Enviar respostas</button>
      </form>

      <div id="examResult" class="exam-result" hidden></div>
    </section>
  </main>

  <footer>
    <p><strong>AvalIA</strong> · Projeto acadêmico demonstrativo</p>
    <p>Nenhum dado pessoal ou corporativo é exibido nesta aplicação.</p>
  </footer>
  <script src="/assets/prova.js" defer></script>
</body>
</html>
